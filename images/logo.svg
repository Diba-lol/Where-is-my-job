<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 180" width="100%" height="100%">
  <defs>
    <!-- Import Anton Font -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Anton&amp;display=swap');
    </style>
    
    <!-- Hard Neo-Brutalist Shadow -->
    <filter id="brutal-shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="8" dy="10" stdDeviation="0" flood-color="#000000" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- BACKGROUND: Crushed Paper Polygons with Neo-Brutalist styling -->
  <g stroke="#000000" stroke-width="2.5" stroke-linejoin="round" filter="url(#brutal-shadow)">
    <!-- Polygons mathematically mapped to look like flattened, crumpled paper -->
    <polygon points="25,25 150,15 140,80 15,75" fill="#ffffff" />
    <polygon points="15,75 140,80 170,145 30,150" fill="#e2e8f0" />
    <polygon points="150,15 350,25 310,95 140,80" fill="#f8fafc" />
    <polygon points="140,80 310,95 370,155 170,145" fill="#f1f5f9" />
    <polygon points="350,25 530,15 550,90 310,95" fill="#ffffff" />
    <polygon points="310,95 550,90 610,140 370,155" fill="#e2e8f0" />
    <polygon points="530,15 640,35 650,95 550,90" fill="#f8fafc" />
    <polygon points="550,90 650,95 610,140" fill="#f1f5f9" />
  </g>

  <!-- LEFT SIDE: The Logo Icon (Darkened for the white paper) -->
  <g transform="translate(45, 42)">
    <!-- Magnifying Glass Lens Outline -->
    <circle cx="40" cy="35" r="30" fill="none" stroke="#000000" stroke-width="8" />
    
    <!-- Magnifying Glass Handle -->
    <line x1="60" y1="55" x2="85" y2="80" stroke="#000000" stroke-width="10" stroke-linecap="round" />
    
    <!-- Cyan Accent on Handle -->
    <line x1="68" y1="63" x2="78" y2="73" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round" />
    
    <!-- Briefcase Inside the Lens -->
    <g transform="translate(26, 22)">
      <!-- Briefcase Handle -->
      <path d="M 8 4 L 8 1 C 8 0 20 0 20 1 L 20 4" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Briefcase Body -->
      <rect x="2" y="4" width="24" height="16" rx="2" fill="#000000"/>
      <!-- Briefcase Line Detail (White for contrast) -->
      <line x1="2" y1="10" x2="26" y2="10" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
    </g>
  </g>

  <!-- RIGHT SIDE: The Project Title Text (Massive, Black, Anton Font) -->
  <text x="390" y="112" font-family="'Anton', Impact, sans-serif" font-size="62" font-weight="normal" fill="#000000" letter-spacing="2" text-anchor="middle">WHERE IS MY JOB</text>
</svg>
