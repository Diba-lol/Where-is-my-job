<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow for a 3D effect -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Centered Main Logo Graphic (Transparent Background) -->
  <g filter="url(#shadow)" transform="translate(12, 15)">
    <!-- Magnifying Glass Lens Outline -->
    <circle cx="170" cy="150" r="70" fill="none" stroke="#ffffff" stroke-width="14" />
    
    <!-- Glass Reflection Accent -->
    <path d="M 120 110 A 50 50 0 0 1 170 90" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.3"/>

    <!-- Magnifying Glass Handle -->
    <line x1="220" y1="200" x2="275" y2="255" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />
    <!-- Handle Grip Accent -->
    <line x1="240" y1="220" x2="260" y2="240" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round" />

    <!-- Briefcase Inside the Lens -->
    <g transform="translate(135, 125)">
      <!-- Briefcase Handle -->
      <path d="M 25 10 L 25 4 C 25 0 45 0 45 4 L 45 10" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
      
      <!-- Briefcase Body -->
      <rect x="10" y="10" width="50" height="34" rx="5" fill="#ffffff"/>
      
      <!-- Briefcase Details (Cutouts/Lines) -->
      <line x1="10" y1="22" x2="60" y2="22" stroke="#4f46e5" stroke-width="2" opacity="0.5"/>
      <rect x="30" y="19" width="10" height="6" rx="2" fill="#312e81"/>
    </g>
  </g>

  <!-- Typography: Project Title -->
  <text x="200" y="335" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">WHERE IS MY JOB</text>
</svg>
